# Undercurl + coloured underlines (Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# tmux started straight from Alacritty (Finder/Dock) gets launchd's bare PATH, so plugin
# scripts (catppuccin, tpm) can't find tmux itself. Put Homebrew back before they run.
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
