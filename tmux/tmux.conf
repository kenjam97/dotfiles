# True colour + undercurl (Alacritty, WezTerm, iTerm all advertise as xterm-256color)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle"
set -as terminal-features ",alacritty:RGB:usstyle"

# action key: C-t (Alacritty Alt bindings send C-t)
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings

set-window-option -g mode-keys vi

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open current directory
if-shell "uname -s | grep -q Darwin" \
  'bind o run-shell "open #{pane_current_path}"' \
  'bind o run-shell "explorer.exe \"$(wslpath -w #{pane_current_path})\" || true"'
bind -r e kill-pane -a

# Splits in the current directory (Alt+D / Alt+Shift+D in Alacritty)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind S choose-session

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Resizing pane (prefix C-hjkl, or Alt+arrows in Alacritty)
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

#### basic settings

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set-option -g status-justify "left"
set-option -g history-limit 64096

# 0 so Esc is instant in Neovim
set -sg escape-time 0

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

#### Theme: Catppuccin Mocha (matches Alacritty + Neovim)
# Plugins live in ~/.tmux/plugins (outside the dotfiles repo)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_directory}"

source ~/.config/tmux/utility.conf

set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
