# macOS Alacritty. Cmd shortcuts are sent to tmux as prefix (Ctrl+T, \u0014) + key,
# so they match the bindings in tmux/tmux.conf. Windows has its own file in windows/alacritty.

[general]
import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[env]
TERM = "xterm-256color"

[terminal]
# Straight into tmux (attach to "main" or create it), same as Windows. The Cmd bindings
# below send tmux's prefix, so they only work inside tmux.
shell = { program = "/opt/homebrew/bin/tmux", args = ["new", "-A", "-s", "main"] }

[cursor]
style = { shape = "Block", blinking = "Off" }
vi_mode_style = { shape = "Beam" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[font]
size = 16.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[scrolling]
history = 10000
multiplier = 1

[window]
decorations = "Buttonless"
opacity = 0.9
option_as_alt = "Both"
dynamic_padding = true
dimensions = { columns = 100, lines = 30 }
padding = { x = 16, y = 16 }

[keyboard]
bindings = [
  # Claude Code: newline without submitting
  { key = "Return", mods = "Shift", chars = "\u001B\r" },

  # tmux: splits / new window / kill pane
  { key = "D", mods = "Command", chars = "\u0014v" },
  { key = "D", mods = "Command|Shift", chars = "\u0014s" },
  { key = "T", mods = "Command", chars = "\u0014c" },
  { key = "W", mods = "Command", chars = "\u0014x" },

  # tmux: move between panes
  { key = "H", mods = "Command", chars = "\u0014h" },
  { key = "J", mods = "Command", chars = "\u0014j" },
  { key = "K", mods = "Command", chars = "\u0014k" },
  { key = "L", mods = "Command", chars = "\u0014l" },

  # tmux: resize panes
  { key = "Left", mods = "Command", chars = "\u0014H" },
  { key = "Down", mods = "Command", chars = "\u0014J" },
  { key = "Up", mods = "Command", chars = "\u0014K" },
  { key = "Right", mods = "Command", chars = "\u0014L" },

  # tmux: windows 1-9
  { key = "Key1", mods = "Command", chars = "\u00141" },
  { key = "Key2", mods = "Command", chars = "\u00142" },
  { key = "Key3", mods = "Command", chars = "\u00143" },
  { key = "Key4", mods = "Command", chars = "\u00144" },
  { key = "Key5", mods = "Command", chars = "\u00145" },
  { key = "Key6", mods = "Command", chars = "\u00146" },
  { key = "Key7", mods = "Command", chars = "\u00147" },
  { key = "Key8", mods = "Command", chars = "\u00148" },
  { key = "Key9", mods = "Command", chars = "\u00149" },
]
